settings.labels.title: "Étiquettes"
settings.labels.description: "Voici vos étiquettes. Elles apparaissent dans la barre latérale, dans la palette de commandes et sur chaque conversation étiquetée. Une étiquette est un nom coloré qui regroupe une ou plusieurs balises de vos comptes : l'appliquer à une conversation écrit la bonne balise dans chaque compte."
settings.labels.from_accounts: "Depuis vos comptes"
settings.labels.from_accounts_description: "Voici les balises brutes de vos fournisseurs : libellés Gmail, catégories Outlook, mots-clés IMAP. Rien ici n'apparaît ailleurs dans Courly tant que vous ne l'ajoutez pas à une étiquette ci-dessus. Elles sont listées pour référence, et pour modifier le nom ou la couleur de chaque balise chez le fournisseur."
settings.labels.bundles_tags_one: "Regroupe %{count} balise"
settings.labels.bundles_tags_other: "Regroupe %{count} balises"
settings.labels.add: "Ajouter une étiquette"
settings.labels.create_tag: "Créer une balise"
settings.labels.new_tag_title: "Nouvelle balise"
settings.labels.edit_tag_title: "Modifier la balise"
settings.labels.tag_editor_description: "Balise du fournisseur : elle se trouve sur le compte lui-même, pas dans Courly. Les modifications faites ici changent la balise chez le fournisseur. Pour afficher cette balise dans la barre latérale, ajoutez-la à une étiquette. Les modifications ne sont pas enregistrées automatiquement : cliquez sur Enregistrer en bas quand vous avez terminé."
settings.labels.name: "Nom"
settings.labels.tag_name_placeholder: "Nom de la balise"
settings.labels.colour: "Couleur"
settings.labels.tag_colour_description: "Elle n'est affichée nulle part dans Courly : la couleur de la balise ne compte que dans le client de votre fournisseur (Gmail sur le web, Outlook, etc.). La changer ici la change aussi là-bas."
settings.labels.new_label_title: "Nouvelle étiquette"
settings.labels.edit_label_title: "Modifier l'étiquette"
settings.labels.label_editor_description: "Donnez un nom et une couleur à votre étiquette, puis choisissez les balises de fournisseur qu'elle représente. Appliquer cette étiquette à une conversation écrit chaque balise dans son compte. Les modifications ne sont pas enregistrées automatiquement : cliquez sur Enregistrer en bas quand vous avez terminé."
