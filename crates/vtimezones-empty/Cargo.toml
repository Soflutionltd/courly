[package]
# Stands in for the GPL-3.0 `vtimezones-rs` through `[patch.crates-io]` in
# the workspace manifest, so the shipped binary carries no GPL code.
name = "vtimezones-rs"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
phf = { version = "0.13", default-features = false }
