[package]
name = "mobile_bridge"
description = "Flutter bridge for the Courly mobile app: the shared Rust core, called in-process from Dart"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
db = { path = "../db" }
rusqlite.workspace = true

# Phones get SQLite compiled into the app: the system copy on iOS is not
# linked by the Flutter plugin, and its version varies with the OS release
# while rusqlite needs recent entry points. Desktop builds are unaffected.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
