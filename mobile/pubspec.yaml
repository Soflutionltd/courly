name: courly_mobile
description: "Courly mobile: Flutter screens over the shared Courly Rust core."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_web_auth_2: ^6.1.0
  material_ui: ^1.1.0
  mobile_bridge:
    path: rust_builder
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
