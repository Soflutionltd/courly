name: Tests

# Every change to main, and every pull request, runs clippy and the unit
# tests of Courly and of its protocol engine, so a release is built from a
# tree whose checks are on record. It publishes nothing and reads no secret.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run moot.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TOOLCHAIN: "1.99.0"

jobs:
  tests:
    name: Clippy and unit tests
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out Courly
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: courly

      - name: Install Rust ${{ env.TOOLCHAIN }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy

      - name: Cache the build
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            courly/target
            courly/crates/conduit/target
          key: tests-${{ runner.os }}-${{ env.TOOLCHAIN }}-${{ hashFiles('courly/Cargo.lock', 'courly/crates/conduit/Cargo.lock') }}
          restore-keys: tests-${{ runner.os }}-${{ env.TOOLCHAIN }}-

      - name: Clippy, Courly
        working-directory: courly
        run: cargo "+$TOOLCHAIN" clippy --locked --workspace --all-targets -- -D warnings

      - name: Unit tests, Courly
        working-directory: courly
        run: cargo "+$TOOLCHAIN" test --locked --workspace --lib

      - name: Clippy, protocol engine
        working-directory: courly
        run: cargo "+$TOOLCHAIN" clippy --locked --manifest-path crates/conduit/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Tests, protocol engine
        working-directory: courly
        run: cargo "+$TOOLCHAIN" test --locked --manifest-path crates/conduit/Cargo.toml --workspace --all-features
