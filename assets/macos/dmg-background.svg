<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" width="660" height="440">
  <!-- Background of the Courly installer window. The app icon sits at
       (165, 205) and the Applications link at (495, 205), both 128 pt;
       scripts/release-macos.sh places them there. Nothing is drawn under
       the icons or their labels, so Finder's own rendering stays legible.
       The instruction stays above y 400: Finder's path bar, when shown,
       covers the bottom of the window. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF7F5"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0.12" cy="0" r="0.75">
      <stop offset="0" stop-color="#16B3B0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#16B3B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="0.95" cy="1.05" r="0.7">
      <stop offset="0" stop-color="#22C97A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22C97A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16B3B0"/>
      <stop offset="1" stop-color="#22C97A"/>
    </linearGradient>
  </defs>

  <rect width="660" height="440" fill="url(#bg)"/>
  <rect width="660" height="440" fill="url(#glowTop)"/>
  <rect width="660" height="440" fill="url(#glowBottom)"/>
  <circle cx="610" cy="-30" r="150" fill="none" stroke="#16B3B0" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="610" cy="-30" r="190" fill="none" stroke="#16B3B0" stroke-opacity="0.05" stroke-width="1.5"/>
  <circle cx="40" cy="470" r="130" fill="none" stroke="#22C97A" stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="330" y="66" font-size="26" font-weight="700" letter-spacing="-0.4" fill="#16302E">Courly</text>
    <text x="330" y="90" font-size="13" font-weight="500" fill="#5E7472">Mail, calendar and contacts</text>
  </g>

  <!-- Arrow from the app to Applications -->
  <g fill="none" stroke="url(#brand)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 262 205 C 300 178, 360 178, 398 205" stroke-width="3" stroke-dasharray="0.1 9"/>
    <path d="M 386 192 L 400 206 L 382 211" stroke-width="3"/>
  </g>

  <!-- Instruction, under the icon labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="330" y="362" font-size="14" font-weight="600" fill="#16302E">Double-click Courly to install it</text>
    <text x="330" y="383" font-size="12.5" font-weight="500" fill="#6B807E">Double-cliquez sur Courly pour l'installer</text>
  </g>
</svg>
